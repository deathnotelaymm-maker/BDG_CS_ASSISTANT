name: v1.15.5 Simplified AI Production Checks

on:
  push:
    branches: [main, production]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: bdg_integration_test
          POSTGRES_USER: bdg_test
          POSTGRES_PASSWORD: bdg_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bdg_test -d bdg_integration_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      VITE_API_BASE: https://api.example.com
      VITE_BDG_API_BASE: https://api.example.com
      VITE_API_BASE_URL: https://api.example.com
      VITE_USE_MOCK: "false"
      VITE_MOCK_MODE: "false"
      TEST_DATABASE_URL: postgresql://bdg_test:bdg_test_password@127.0.0.1:5432/bdg_integration_test
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.18.0
          cache: npm
          registry-url: https://registry.npmjs.org
          cache-dependency-path: |
            backend-api/package-lock.json
            guide-pro/package-lock.json
            chat-pro/package-lock.json
            admin-pro/package-lock.json

      - name: Verify Render backend
        working-directory: backend-api
        run: |
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm run check
          npm run test:regression
          npm run test:prompt-runtime
          npm run test:simplified-ai
          npm run test:chat-reliability
          npm run test:security
          npm run test:structured
          npm run test:upload
          npm run test:integration
          npm audit --audit-level=high

      - name: Build Guide Pro
        working-directory: guide-pro
        run: |
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm run typecheck
          npm run build
          npm audit --audit-level=high

      - name: Build Chat Pro
        working-directory: chat-pro
        run: |
          npm ci --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm run typecheck
          npm run build
          npm audit --audit-level=high

      - name: Build Admin Pro
        working-directory: admin-pro
        run: |
          npm ci --legacy-peer-deps --no-audit --no-fund --registry=https://registry.npmjs.org/
          npm run typecheck
          npm run build
          npm audit --audit-level=high
